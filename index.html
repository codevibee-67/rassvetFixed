/* ---- Защита от масштабирования в iOS Safari ----
   Причина: начиная с iOS 10 Safari игнорирует user-scalable=no и maximum-scale (ради доступности),
   поэтому двойной тап и щипок по-прежнему приближают страницу. Отменяем их явно.
   Обычные тапы, удержания, свайпы и pointer-управление (джойстик, кнопки) не затрагиваются. */
(function(){
 var opt={passive:false};
 /* щипок / жесты масштабирования (Safari) */
 ['gesturestart','gesturechange','gestureend'].forEach(function(n){
  document.addEventListener(n,function(e){e.preventDefault()},opt);
 });
 /* щипок через touchmove: только когда реально меняется масштаб (scale!=1),
    так что два пальца на джойстике и кнопках работают как раньше */
 document.addEventListener('touchmove',function(e){
  if(e.scale&&e.scale!==1&&e.cancelable)e.preventDefault();
 },opt);
 /* двойной тап: второе касание в течение 350 мс не даёт зума.
    Для кнопок/элементов с onclick вызываем click вручную, т.к. preventDefault отменяет синтетический click. */
 var last=0;
 document.addEventListener('touchend',function(e){
  var now=Date.now(),d=now-last;last=now;
  if(d>350||d<=0||!e.cancelable)return;
  var t=e.target;
  if(t&&t.closest&&t.closest('input,select,textarea,label,a'))return; /* формы работают как обычно */
  e.preventDefault();
  var el=t;
  while(el&&el!==document){
   if(el.tagName==='BUTTON'||typeof el.onclick==='function'||(el.hasAttribute&&el.hasAttribute('onclick'))){
    if(!el.disabled)el.click();
    break;
   }
   el=el.parentNode;
  }
 },opt);
 /* на всякий случай: двойной клик/контекстное меню не должны ничего приближать */
 document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
})();
</script>
